name: "Workflow SHAs"
description: "Track and enforce gh-actions-lock adoption for GitHub Actions across a GitHub organization."
branding:
  icon: shield
  color: blue

inputs:
  command:
    description: "Subcommand to run: check, lock, or enforce."
    required: true
  org:
    description: "GitHub organization to operate on."
    required: true
  tracking-repo:
    description: "Repo name for the tracking issue (required for 'check' command unless dry-run is enabled)."
    required: false
    default: ""
  repos:
    description: "Comma-separated list of specific repos to process (optional)."
    required: false
    default: ""
  dry-run:
    description: "Run in dry-run mode (no mutations)."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: Install gh-actions-lock
      shell: bash
      run: |
        if ! gh extension list | grep -q 'gh-actions-lock'; then
          gh extension install github/gh-actions-lock --pin v0.4.0
        fi

    - name: Run workflow-shas
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        args="--org ${{ inputs.org }} ${{ inputs.command }}"

        # Command-specific args
        if [ "${{ inputs.command }}" = "check" ]; then
          if [ -z "${{ inputs.tracking-repo }}" ] && [ "${{ inputs.dry-run }}" != "true" ]; then
            echo "::error::tracking-repo input is required for the check command unless dry-run is enabled"
            exit 1
          fi
          if [ -n "${{ inputs.tracking-repo }}" ]; then
            args="$args --tracking-repo ${{ inputs.tracking-repo }}"
          fi
        fi

        # Repo filter
        if [ -n "${{ inputs.repos }}" ]; then
          IFS=',' read -ra REPOS <<< "${{ inputs.repos }}"
          for repo in "${REPOS[@]}"; do
            repo=$(echo "$repo" | xargs)  # trim whitespace
            if [ -n "$repo" ]; then
              args="$args --repo $repo"
            fi
          done
        fi

        # Dry run
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          args="$args --dry-run"
        fi

        uv run workflow-shas $args
